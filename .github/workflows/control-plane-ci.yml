name: control-plane-ci

on:
  push:
    branches: [main]
    paths:
      - apps/control-plane/**
      - .github/workflows/control-plane-ci.yml
  pull_request:
    paths:
      - apps/control-plane/**

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/control-plane

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/control-plane } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/control-plane/requirements.txt }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --ignore-missing-imports --no-strict-optional .
      - name: Pytest
        run: pytest -v

  build-push:
    needs: lint-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/control-plane
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Install & Run Trivy scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          IMAGE_LOWER=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          trivy image --format sarif --output trivy.sarif --severity HIGH,CRITICAL --exit-code 0 ${IMAGE_LOWER}:sha-${{ github.sha }}
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_LOWER=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes ${IMAGE_LOWER}@${DIGEST}

