name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push tagged image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/control-plane
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/control-plane:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/control-plane:stable
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        env: { DIGEST: ${{ steps.build.outputs.digest }} }
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/control-plane@${DIGEST}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
