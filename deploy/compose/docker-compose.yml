# Compose file lives at deploy/compose/. Run from there:
#   docker compose --env-file ../../.env up
# Or use the root Makefile: `make up`
#
# All paths below are relative to this file's location.

version: "3.8"

x-volumes-base: &volumes_base ../../volumes

services:
  etcd:
    container_name: nebula-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ../../volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [nebula]

  minio:
    container_name: nebula-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports: ["9100:9000", "9101:9001"]
    volumes: ["../../volumes/minio:/minio_data"]
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [nebula]

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes: ["../../volumes/milvus:/var/lib/milvus"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports: ["19530:19530", "9091:9091"]
    depends_on: [etcd, minio]
    networks: [nebula]

  control-plane:
    container_name: nebula-control-plane
    build:
      context: ../../apps/control-plane
      dockerfile: Dockerfile
    image: ghcr.io/nebulastream/control-plane:local
    env_file: [../../.env]
    environment:
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
    volumes:
      - ../../apps/dashboard:/app/dashboard:ro
    ports: ["8000:8000"]
    depends_on:
      milvus-standalone:
        condition: service_healthy
    restart: unless-stopped
    networks: [nebula]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    container_name: nebula-prometheus
    image: prom/prometheus:v2.54.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    networks: [nebula]
    profiles: [observability]

  alertmanager:
    container_name: nebula-alertmanager
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]
    networks: [nebula]
    profiles: [observability]

  grafana:
    container_name: nebula-grafana
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    networks: [nebula]
    profiles: [observability]

  redis:
    container_name: nebula-redis
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [nebula]

  jaeger:
    container_name: nebula-jaeger
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks: [nebula]
    profiles: [observability]

  envoy:
    container_name: nebula-envoy
    image: envoyproxy/envoy:v1.30.0
    volumes:
      - ../envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080" # Ingress L7 router
      - "9901:9901" # Admin port
    networks: [nebula]
    profiles: [envoy]

networks:
  nebula:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

