apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nebulastream-control-plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebulastream
  source:
    repoURL: https://github.com/REPLACE_ME/NebulaStream.git
    targetRevision: main
    path: charts/nebulastream
    helm:
      releaseName: nebulastream
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: nebulastream
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
  revisionHistoryLimit: 10
